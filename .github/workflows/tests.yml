name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            torch: '2.1.2'
            profile: requirements.txt
          - python: '3.13'
            torch: '2.13.0'
            profile: requirements-cuda.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r ${{ matrix.profile }} -e . build
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p 'test*.py'
        env:
          OMP_NUM_THREADS: '2'
          HF_HUB_OFFLINE: '1'
      - run: python -m build
      - run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Verify packaged pool resources outside the checkout
        run: cd /tmp && reta validate-pool-release
