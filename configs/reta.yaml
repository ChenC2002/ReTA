data:
  # Path to processed.pt generated by:
  # python -m reta.data.preprocess --out_dir data/processed
  processed_path: data/processed/processed.pt

  # Patient-level split manifest written by preprocessing. Training is limited
  # to the named split to prevent validation/test leakage.
  split_json: data/processed/splits.json
  train_split: train

  # Stage 1 uses this many sequential transitions per optimizer step
  batch_size: 32

knowledge:
  # Final clustered pool produced by:
  # python -m reta.knowledge.clustering --out_jsonl data/knowledge/templates.jsonl
  templates_jsonl: data/knowledge/templates.jsonl

  # Retrieval Top-K per visit (action space size = 2K + 1 with Skip)
  retrieval_K: 20

  # Eq. 1 history-aware retrieval weight alpha
  retrieval_alpha: 0.3

  # Mapping external KG ids -> token ids used by Hard Import. Generate this
  # file with `reta build-entity-map` after clustering the template pool.
  # ICD:/CCS: ids are read from processed.pt.
  # External token ids must be unique and contiguous, starting at
  # icd_vocab_size + ccs_vocab_size from processed.pt.
  entity_to_token_json: data/resources/entity_to_token.json

model:
  # Embedding/hidden dimension (default 256)
  dim: 256

  # Number of GAT layers in structure channel
  gnn_layers: 2

  # Attention heads for semantic self-attention and GAT
  attn_heads: 4

  # Dropout used in encoders/predictor
  dropout: 0.3

outputs:
  checkpoints_dir: checkpoints
  logs_dir: logs

train:
  # Reproducibility
  seed: 42

  # Device string for torch.device()
  device: auto

  # Optimizer
  lr: 1e-4
  weight_decay: 1e-5
  grad_clip: 0.5

  # -------------------------
  # Stage 1: Warm-up
  # -------------------------
  # Number of warm-up epochs
  warmup_epochs: 30

  # Bernoulli exposure probability for stochastic augmentation during warm-up
  exposure_prob: 0.3

  # Soft Import scale xi
  soft_xi: 0.5

  # -------------------------
  # Stage 2: RL + refinement
  # -------------------------
  # REINFORCE iterations
  rl_iters: 50

  # Number of patient trajectories sampled per RL iteration
  rollout_patients: 64

  # Safety cap for very long trajectories in rollouts
  max_visits_per_patient: 50

  # How many batches worth of supervised refinement per RL iteration
  encoder_updates_per_iter: 1

  # Policy optimization (REINFORCE)
  policy_lr: 1e-5
  gamma: 0.95
  baseline_decay: 0.99
  policy_entropy_coef: 0.0

  # Paired reward weights
  reward_lambda1: 1.0
  reward_lambda2: 0.1

  # Running template utility decay gamma_r
  utility_decay: 0.95
